<title>Study Practice tests</title>
<style>
  body { margin: 0; padding: 16px; background: #f6f4ee; color: #1b1b1a; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 18px 0 6px; color: #4a4843; }

  #summary.ok { color: #0b7a0b; } #summary.bad { color: #b42318; }
  .row { display: grid; grid-template-columns: 52px 1fr; gap: 2px 10px; padding: 5px 8px; background: #fff; border-radius: 6px; margin: 3px 0; }
  .mark { font-weight: 700; font-size: 12px; }
  .row.ok .mark { color: #0b7a0b; } .row.bad .mark { color: #b42318; } .row.bad { outline: 2px solid #b42318; }
  .detail { grid-column: 2; color: #6b6963; font-size: 12px; }
</style>
